ffects of climate change completely.", "choices": ["eliminate", "increase", "encourage", "expand"], "answer": 0, "explain": "eliminate = loại bỏ"}, {"q": "The word 'diverse' is closest in meaning to ___.", "choices": ["varied", "similar", "uniform", "identical"], "answer": 0, "explain": "diverse = đa dạng"}, {"q": "The local community has benefited ___ the new hospital.", "choices": ["from", "with", "of", "by"], "answer": 0, "explain": "benefit from = hưởng lợi từ"}, {"q": "We need to find a sustainable ___ to this problem.", "choices": ["solve", "solution", "solving", "solved"], "answer": 1, "explain": "find a solution to = tìm giải pháp cho"}, {"q": "The opposite of 'accept' is ___.", "choices": ["admit", "receive", "reject", "approve"], "answer": 2, "explain": "accept ≠ reject"}, {"q": "The word 'prominent' is closest in meaning to ___.", "choices": ["well-known", "ordinary", "hidden", "unimportant"], "answer": 0, "explain": "prominent = nổi bật, có tiếng"}, {"q": "Students are expected to ___ with the school rules.", "choices": ["comply", "apply", "supply", "reply"], "answer": 0, "explain": "comply with = tuân thủ"}, {"q": "The project was successful ___ careful planning.", "choices": ["due to", "although", "despite of", "because"], "answer": 0, "explain": "due to + cụm danh từ = nhờ/vì"}, {"q": "The word 'enhance' is closest in meaning to ___.", "choices": ["improve", "damage", "reduce", "prevent"], "answer": 0, "explain": "enhance = nâng cao, cải thiện"}, {"q": "The company wants to attract highly ___ employees.", "choices": ["skill", "skilled", "skilling", "skills"], "answer": 1, "explain": "skilled employees = nhân viên có tay nghề"}, {"q": "The opposite of 'urban' is ___.", "choices": ["city", "industrial", "rural", "modern"], "answer": 2, "explain": "urban ≠ rural"}, {"q": "We should be aware ___ the risks of sharing personal information online.", "choices": ["of", "for", "to", "with"], "answer": 0, "explain": "be aware of = nhận thức được"}, {"q": "The wo let idx=0,selected=-1,score=0,locked=false,history=[];
const $=id=>document.getElementById(id);
function render(){const q=questions[idx];selected=-1;locked=false;$('counter').textContent=`${idx+1}/100`;$('score').textContent=score;$('percent').textContent=`${Math.round((idx+1)/100*100)}%`;$('progress').style.width=`${(idx+1)}%`;$('question').textContent=`${idx+1}. ${q.q}`;$('options').innerHTML='';$('feedback').classList.add('hide');$('next').classList.add('hide');$('check').classList.remove('hide');$('check').disabled=true;q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span></span>`;b.lastElementChild.textContent=c;b.onclick=()=>{if(locked)return;selected=i;document.querySelectorAll('.option').forEach(x=>x.style.outline='');b.style.outline='2px solid var(--primary)';$('check').disabled=false};$('options').appendChild(b)});}
function check(){if(selected<0||locked)return;locked=true;const q=questions[idx],ok=selected===q.answer;if(ok)score++;history.push({idx,selected,ok});document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.style.outline='';if(i===q.answer)b.classList.add('correct');if(i===selected&&!ok)b.classList.add('wrong')});$('score').textContent=score;$('feedback').classList.remove('hide');$('feedback').innerHTML=`<strong style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Chính xác! 🎉':'Chưa đúng.'}</strong><br>Đáp án: <strong>${'ABCD'[q.answer]}. ${q.choices[q.answer]}</strong><br>${q.explain}`;$('check').classList.add('hide');$('next').textContent=idx===99?'Xem kết quả →':'Câu tiếp theo →';$('next').classList.remove('hide')}
function next(){if(idx<99){idx++;render()}else finish()}
function finish(){ $('game').classList.add('hide');$('result').classList.remove('hide');$('progress').style.width='100%';$('counter').textContent='100/100';const pct=Math.round(score);let msg=pct>=90?'Xuất sắc! Bạn đã nắm khá vững bộ từ vựng.':pct>=75?'Rất tốt! Hãy ôn lại các câu sai.':pct>=50?'Khá ổn, nhưng bạn nên luyện thêm từ đồng nghĩa và cụm từ.':'Đừng nản nhé! Hãy xem lại đáp án và làm lại để ghi nhớ.';$('result').innerHTML=`<div style="font-size:48px">${pct>=80?'🏆':'📚'}</div><h2>Hoàn thành bài quiz!</h2><div class="score">${score}/100</div><p>${pct}% câu trả lời đúng</p><p>${msg}</p><div class="actions"><button class="btn primary" id="again">Làm lại từ đầu</button><button class="btn secondary" id="showreview">Xem lại câu sai</button></div><div id="review"></div>`;$('again').onclick=()=>{idx=0;score=0;history=[];$('game').classList.remove('hide');$('result').classList.add('hide');render()};$('showreview').onclick=()=>{const wrong=history.filter(x=>!x.ok);$('review').innerHTML=wrong.length?wrong.map(x=>{const q=questions[x.idx];return `<div class="review-item"><strong>Câu ${x.idx+1}. ${escapeHtml(q.q)}</strong><p class="tiny">Bạn chọn: ${'ABCD'[x.selected]}. ${escapeHtml(q.choices[x.selected])}</p><p>Đáp án đúng: <strong>${'ABCD'[q.answer]}. ${escapeHtml(q.choices[q.answer])}</strong></p><p>${escapeHtml(q.explain)}</p></div>`}).join(''):'<p>Bạn không sai câu nào. Tuyệt vời!</p>'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('check').onclick=check;$('next').onclick=next;render();
</script></body></html>
